<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E00" />
      <stop offset="50%" stop-color="#FF7518" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255, 94, 0, 0.2)" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Inner Radiant Badge -->
  <rect x="136" y="136" width="240" height="240" rx="60" fill="url(#flameGrad)" filter="url(#flameGlow)" />

  <!-- Athletic Flame Glyph -->
  <path 
    d="M 256 168 C 266 200 290 220 308 240 C 330 264 344 292 344 326 C 344 374 304 414 256 414 C 208 414 168 374 168 326 C 168 280 200 244 232 216 C 244 206 252 190 256 168 Z M 256 270 C 238 290 226 312 226 334 C 226 350 240 364 256 364 C 272 364 286 350 286 334 C 286 314 274 294 256 270 Z" 
    fill="#FFFFFF" 
  />
</svg>
