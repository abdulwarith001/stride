<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="STRIDE" />
    <meta name="description" content="100% Offline satellite GPS circuit running tracker." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>STRIDE // Checkpoint Run Tracker</title>
  </head>
  <body class="bg-white text-zinc-900 min-h-[100dvh]">
    <div id="root">
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center; box-sizing: border-box;">
        <div style="width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #FF5E00 0%, #FFA000 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(255, 94, 0, 0.35); margin-bottom: 20px; animation: stridePulse 2s ease-in-out infinite;">
          <svg viewBox="0 0 24 24" width="38" height="38" fill="#FFFFFF" stroke="none">
            <path d="M12 2C12.5 4 14.5 5.5 16 7.5C18 10 19 12.5 19 15.5C19 19.5 15.8 22 12 22C8.2 22 5 19.5 5 15.5C5 12 7.5 9 10 6.5C11 5.5 11.5 4 12 2Z" />
          </svg>
        </div>
        <h1 style="font-size: 26px; font-weight: 900; letter-spacing: -0.5px; color: #18181B; margin: 0 0 6px 0; text-transform: uppercase;">
          STRIDE
        </h1>
        <p style="font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #A1A1AA; text-transform: uppercase; margin: 0 0 32px 0;">
          CIRCUIT RUN TRACKER
        </p>
        <div style="width: 140px; height: 4px; background: #F4F4F5; border-radius: 999px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; left: 0; height: 100%; width: 45%; background: linear-gradient(90deg, #FF5E00, #FFA000); border-radius: 999px; animation: strideLoading 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes stridePulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.05); }
        }
        @keyframes strideLoading {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
